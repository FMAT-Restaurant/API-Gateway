_format_version: "3.0"

consumers:
  - username: fmat-auth-service
    jwt_secrets:
      - key: "urn:fmat:restaurant:auth"
        algorithm: HS256
        secret: "${JWT_SECRET}"

services:
  # ---------------------------------------------------------------------------
  # Auth Microservice
  # ---------------------------------------------------------------------------
  - name: auth-service
    url: http://auth-backend:8080
    routes:
      # Rutas públicas (Login, Setup Admin, Health, Refresh)
      - name: auth-public-routes
        paths:
          - /api/v1/auth/login
          - /api/v1/auth/refresh
          - /api/v1/auth/setup-admin
          - /health
        strip_path: false

      # Rutas privadas de Auth (Staff, Me, Change Password)
      - name: auth-protected-routes
        paths:
          - /api/v1/auth/
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify:
                - exp
          - name: auth-perimeter

  # ---------------------------------------------------------------------------
  # Menu Microservice
  # ---------------------------------------------------------------------------
  - name: menu-service
    url: http://menu-backend:8081
    routes:
      - name: menu-routes
        paths:
          - /api/v1/menu
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify:
                - exp
          - name: auth-perimeter

  # ---------------------------------------------------------------------------
  # Orders & KDS Microservice
  # ---------------------------------------------------------------------------
  - name: orders-service
    url: http://orders-backend:8082
    routes:
      - name: orders-routes
        paths:
          - /api/v1/orders
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify:
                - exp
          - name: auth-perimeter

plugins:
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Authorization
        - Content-Type