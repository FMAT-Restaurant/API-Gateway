networks:
  # Red compartida con el resto de microservicios del restaurante.
  # Compose crea esta red; los otros proyectos deben unirse a ella como external.
  restaurant-network:
    name: restaurant-network
    external: false

services:
  kong:
    image: kong:3.4
    container_name: fmat-api-gateway
    networks:
      - restaurant-network
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /tmp/kong.yml
      KONG_PLUGINS: "bundled,auth-perimeter"
      KONG_LUA_PACKAGE_PATH: "/usr/local/custom-plugins/?.lua;/usr/local/share/lua/5.1/?.lua;;"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env (minimo 32 bytes)}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
    ports:
      - "${KONG_PROXY_PORT:-8000}:8000"
      - "127.0.0.1:${KONG_ADMIN_PORT:-8001}:8001"
    volumes:
      - ./config/kong.yml:/usr/local/kong/declarative/kong.yml.template:ro
      - ./config/render.lua:/usr/local/kong/declarative/render.lua:ro
      - ./plugins/auth-perimeter:/usr/local/custom-plugins/kong/plugins/auth-perimeter:ro
    # Render seguro: JSON es valido como valor YAML y escapa el secreto.
    command:
      - /bin/bash
      - -c
      - |
        set -euo pipefail
        umask 077
        /usr/local/openresty/bin/resty /usr/local/kong/declarative/render.lua
        exec /docker-entrypoint.sh kong docker-start
    restart: on-failure
