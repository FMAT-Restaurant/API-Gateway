networks:
  # Red compartida con el resto de microservicios del restaurante.
  # Se crea una sola vez de forma manual: docker network create restaurant-network
  restaurant-network:
    name: restaurant-network
    external: true

services:
  kong:
    image: kong:3.4
    container_name: fmat-api-gateway
    networks:
      - restaurant-network
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /tmp/kong.yml
      KONG_PLUGINS: "bundled,auth-perimeter"
      KONG_LUA_PACKAGE_PATH: "/usr/local/custom-plugins/?.lua;/usr/local/share/lua/5.1/?.lua;;"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_restaurant_auth_2026!}
    ports:
      - "${KONG_PROXY_PORT:-8000}:8000"
      - "${KONG_ADMIN_PORT:-8001}:8001"
    volumes:
      - ./config/kong.yml:/usr/local/kong/declarative/kong.yml.template:ro
      - ./plugins/auth-perimeter:/usr/local/custom-plugins/kong/plugins/auth-perimeter:ro
    # Kong 3.4 NO interpola variables de entorno en la configuracion declarativa.
    # Por eso la plantilla se renderiza en el arranque sustituyendo ${JWT_SECRET}
    # por el valor real de la variable de entorno.
    command:
      - /bin/bash
      - -c
      - |
        set -euo pipefail
        if [ -z "$$JWT_SECRET" ]; then
          echo "ERROR: JWT_SECRET no esta definido (revisa el archivo .env)" >&2
          exit 1
        fi
        perl -pe 's/\$\{JWT_SECRET\}/$$ENV{JWT_SECRET}/g' \
          /usr/local/kong/declarative/kong.yml.template > /tmp/kong.yml
        exec /docker-entrypoint.sh kong docker-start
    restart: on-failure
