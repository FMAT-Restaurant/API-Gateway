_format_version: "3.0"

consumers:
  - username: fmat-auth-service
    jwt_secrets:
      - key: "urn:fmat:restaurant:auth"
        algorithm: HS256
        secret: "{vault://env/jwt-secret}"

services:
  - name: auth-service
    url: http://auth-backend:3000
    routes:
      - name: auth-public-routes
        paths:
          - /api/v1/auth/login
          - /api/v1/auth/refresh
          - /api/v1/auth/setup-admin
          - /api/v1/auth/setup-status
          - /health
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 20
              hour: 200
              policy: local
              fault_tolerant: true

      - name: auth-protected-routes
        paths:
          - /api/v1/auth/
          - /api/v1/staff
          - /api/v1/roles
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify:
                - exp
          - name: auth-perimeter

  - name: menu-service
    url: http://menu-backend:8081
    routes:
      - name: menu-routes
        paths:
          - /api/v1/menu
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify:
                - exp
          - name: auth-perimeter

  - name: orders-service
    url: http://orders-backend:8082
    routes:
      - name: orders-routes
        paths:
          - /api/v1/orders
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify:
                - exp
          - name: auth-perimeter

  - name: inventory-service
    url: http://inventory-backend:8083
    routes:
      - name: inventory-routes
        paths:
          - /api/v1/inventory
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify:
                - exp
          - name: auth-perimeter

  - name: payments-service
    url: http://payments-backend:8084
    routes:
      - name: payments-routes
        paths:
          - /api/v1/payments
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify:
                - exp
          - name: auth-perimeter

  - name: floor-service
    url: http://floor-backend:8085
    routes:
      - name: floor-routes
        paths:
          - /api/v1/floor
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify:
                - exp
          - name: auth-perimeter

plugins:
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Authorization
        - Content-Type